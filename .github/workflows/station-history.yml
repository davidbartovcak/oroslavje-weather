name: Update station history

on:
  schedule:
    # GitHub's own scheduler is unreliable for sub-hourly cron: in practice,
    # a */15 schedule fired once in over 5 hours instead of every 15 min.
    # */30 doesn't guarantee better adherence, but is worth trying before
    # reaching for an external trigger.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: station-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch station data
        id: fetch
        run: node scripts/fetch-station-history.js
        continue-on-error: true

      - name: Commit and push whatever succeeded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in station-history-oroslavje.json station-history-opatija.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No change in station history files — skipping commit"
          else
            git commit -m "Update station history snapshots"
            git push
          fi

      - name: Fail the run if any station fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
